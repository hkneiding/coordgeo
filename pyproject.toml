[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coordgeo"
version = "0.1.0"
description = "Lightweight coordination geometry identification for mononuclear metal complexes"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Hannes Kneiding"},
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
# Only needed to construct the ase.Atoms objects passed to analyze();
# coordgeo itself never imports ase (see io.structure_from_ase_atoms).
ase = ["ase>=3.22"]
test = ["pytest", "ase>=3.22"]

[project.urls]
Repository = "https://github.com/hkneiding/coordgeo"

[project.scripts]
coordgeo = "coordgeo.cli:main"

[tool.setuptools.packages.find]
include = ["coordgeo*"]

[tool.setuptools.package-data]
coordgeo = ["py.typed"]
